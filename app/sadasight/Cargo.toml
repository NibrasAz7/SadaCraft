[package]
name = "sadasight"
version = "0.1.0"
edition = "2021"
description = "SadaCraft screen spotlight overlay (cursor ring, click ripples, laser trail, dim spotlight, annotation pen)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
] }
